<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>ти затролен</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b1f3a;
      font-family: 'Segoe UI', 'Arial', system-ui, sans-serif;
      padding: 16px;
    }

    .troll-screen {
      width: 100%;
      max-width: 820px;
      aspect-ratio: 16 / 9;
      /* ☝️ ОСНОВНА ФІШКА: верх блакитний, низ жовтий */
      background: linear-gradient(to bottom, 
        #1e90ff 0%, #1e90ff 49.5%, 
        #ffd700 50.5%, #ffd700 100%
      );
      border-radius: 36px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 0 0 2px rgba(255, 215, 0, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 30px 24px 40px;
      position: relative;
      transition: box-shadow 0.2s;
      border: 2px solid #ffd966;
      overflow: hidden;
    }

    /* Додатковий ефект — ледь помітна хвиля, щоб не було нудно */
    .troll-screen::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 36px;
      background: radial-gradient(circle at 30% 50%, rgba(255, 255, 255, 0.05), transparent 60%);
      pointer-events: none;
      z-index: 1;
    }

    /* ⬆️ Субтитри піднімаються вгору */
    .subtitle-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      /* анімація підйому вгору */
      animation: floatUp 4s ease-in-out infinite alternate;
    }

    @keyframes floatUp {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-30px); }
    }

    .subtitle-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 60px;
      padding: 18px 28px;
      border-left: 4px solid #ffd700;
      border-right: 4px solid #ffd700;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 215, 0, 0.2);
      transition: all 0.25s ease;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .subtitle-text {
      color: #fff9e6;
      font-size: clamp(1.4rem, 6vw, 2.4rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7), 0 0 12px #00000055;
      text-align: center;
      line-height: 1.3;
      word-break: break-word;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      transition: opacity 0.2s;
      width: 100%;
    }

    .subtitle-text span {
      background: linear-gradient(to right, #ffe68f, #ffd966);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 18px #ffb80066;
    }

    /* напис "ти затролен" */
    .footer-tag {
      position: absolute;
      bottom: 14px;
      right: 24px;
      color: rgba(255, 240, 150, 0.6);
      font-size: 0.9rem;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      z-index: 20;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 14px;
      border-radius: 40px;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255, 215, 0, 0.15);
      font-family: monospace;
    }

    /* кнопка перезапуску */
    .restart-btn {
      position: absolute;
      top: 18px;
      right: 24px;
      z-index: 30;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 215, 0, 0.2);
      color: #ffd966;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: 0.2s;
      font-family: inherit;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .restart-btn:hover {
      background: rgba(255, 215, 0, 0.2);
      border-color: #ffd966;
      color: #fff3c9;
      transform: scale(1.03);
    }

    /* адаптив */
    @media (max-width: 500px) {
      .troll-screen {
        padding: 20px 16px 30px;
        border-radius: 24px;
      }
      .subtitle-box {
        padding: 14px 18px;
        min-height: 70px;
        border-radius: 40px;
      }
      .subtitle-text {
        font-size: clamp(1.0rem, 5vw, 1.6rem);
      }
      .footer-tag {
        font-size: 0.6rem;
        bottom: 10px;
        right: 14px;
        padding: 2px 10px;
      }
      @keyframes floatUp {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-15px); }
      }
    }

    /* анімація появи субтитрів */
    .subtitle-text {
      animation: fadePop 0.4s ease;
    }
    @keyframes fadePop {
      0% { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* мемні крапочки (додатковий прикол) */
    .glitch-dots {
      position: absolute;
      inset: 0;
      border-radius: 36px;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      opacity: 0.25;
    }
    .glitch-dots span {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 12px #ffd700;
      animation: floatDot 12s infinite linear;
    }
    .glitch-dots span:nth-child(1) { left: 10%; top: 20%; animation-duration: 14s; background: #4a7db5; }
    .glitch-dots span:nth-child(2) { left: 80%; top: 70%; animation-duration: 18s; background: #ffd700; }
    .glitch-dots span:nth-child(3) { left: 40%; top: 10%; animation-duration: 10s; background: #ffb81a; }
    .glitch-dots span:nth-child(4) { left: 70%; top: 40%; animation-duration: 20s; background: #2a6bb0; }
    .glitch-dots span:nth-child(5) { left: 20%; top: 85%; animation-duration: 16s; background: #f7c948; }
    .glitch-dots span:nth-child(6) { left: 90%; top: 20%; animation-duration: 22s; background: #3f7ec6; }
    .glitch-dots span:nth-child(7) { left: 50%; top: 60%; animation-duration: 13s; background: #f5b81a; }
    .glitch-dots span:nth-child(8) { left: 5%; top: 45%; animation-duration: 19s; background: #ffd700; }

    @keyframes floatDot {
      0% { transform: translateY(0px) scale(1); opacity: 0.6; }
      50% { transform: translateY(-30px) scale(1.6); opacity: 1; }
      100% { transform: translateY(0px) scale(1); opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div class="troll-screen" id="trollScreen">

    <!-- мемні крапочки -->
    <div class="glitch-dots">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- субтитри, які піднімаються вгору -->
    <div class="subtitle-wrapper" id="subtitleWrapper">
      <div class="subtitle-box" id="subtitleBox">
        <div class="subtitle-text" id="subtitleText">
          <span>🚀 знімай труси — іди в полет!</span>
        </div>
      </div>
    </div>

    <!-- напис "ти затролен" -->
    <div class="footer-tag">🎬 ти затролен</div>

    <!-- кнопка перезапуску -->
    <button class="restart-btn" id="restartBtn">⟳ перезапустити</button>
  </div>

  <script>
    (function() {
      // СЦЕНАРІЙ СУБТИТРІВ
      const subtitleLines = [
        { text: "🔥 знімай труси — іди в полет!", delay: 2800 },
        { text: "💀 ти думав це кінець? — НІ, ЦЕ ТІЛЬКИ ПОЧАТОК!", delay: 2500 },
        { text: "😈 знімай труси — іди в полет!", delay: 2700 },
        { text: "🤡 мем: 'я нічого не розумію, але це геніально'", delay: 2400 },
        { text: "🚀 знімай труси — іди в полет!", delay: 2800 },
        { text: "🧨 а тепер найголовніше: ТИ ЗАТРОЛЕН!", delay: 3000 },
        { text: "🩲 знімай труси — іди в полет!", delay: 2700 },
        { text: "🏁 фінал? ні, просто мемний цирк", delay: 2300 },
        { text: "🔥 знімай труси — іди в полет!", delay: 2800 },
        { text: "🎬 кінець? НІ, ЦЕ ТІЛЬКИ ПОЧАТОК (перезапусти)", delay: 3500 }
      ];

      const memeExtra = [
        "😎 це той самий момент...",
        "🤣 'а де гроші?' — мем",
        "🐧 лол, ти це бачиш?",
        "🍿 попкорн готовий?",
        "🎥 і знову... знімай труси!"
      ];

      function buildQueue() {
        const queue = [];
        queue.push({ text: "🔥 знімай труси — іди в полет!", delay: 2800 });
        for (let i = 0; i < 5; i++) {
          const memeText = memeExtra[i % memeExtra.length];
          queue.push({ text: memeText, delay: 2500 });
          queue.push({ text: "🩲 знімай труси — іди в полет!", delay: 2700 });
          if (i % 2 === 0) {
            queue.push({ text: "🤯 а ти думав, я забув?", delay: 2200 });
            queue.push({ text: "🚀 знімай труси — іди в полет!", delay: 2800 });
          }
        }
        queue.push({ text: "💀 ТИ ЗАТРОЛЕН, ДРУЖЕ!", delay: 3000 });
        queue.push({ text: "🔥 знімай труси — іди в полет!", delay: 2800 });
        queue.push({ text: "🎬 (кінець? перезапусти, якщо хочеш ще)", delay: 4000 });
        return queue;
      }

      let queue = buildQueue();
      let index = 0;
      let timeoutId = null;
      let isPlaying = false;

      const subtitleTextEl = document.getElementById('subtitleText');

      function showNextSubtitle() {
        if (!isPlaying) return;

        if (index >= queue.length) {
          index = 0;
        }

        const entry = queue[index];
        subtitleTextEl.innerHTML = `<span>${entry.text}</span>`;

        // анімація появи
        subtitleTextEl.style.animation = 'none';
        setTimeout(() => {
          subtitleTextEl.style.animation = 'fadePop 0.4s ease';
        }, 10);

        index++;
        const delay = entry.delay || 2600;
        timeoutId = setTimeout(() => {
          showNextSubtitle();
        }, delay);
      }

      function startTrolling() {
        if (timeoutId) {
          clearTimeout(timeoutId);
          timeoutId = null;
        }

        const baseLines = [
          { text: "🔥 знімай труси — іди в полет!", delay: 2800 },
          { text: "💀 це не кінець, це початок мемів", delay: 2400 },
          { text: "🩲 знімай труси — іди в полет!", delay: 2700 },
          { text: "😎 пам'ятаєш? 'ти затролен'", delay: 2200 },
          { text: "🚀 знімай труси — іди в полет!", delay: 3000 },
          { text: "🧨 мем: 'а де штанці?'", delay: 2500 },
          { text: "🩲 знімай труси — іди в полет!", delay: 2800 },
          { text: "🎭 цей прикол вічний", delay: 2100 },
          { text: "🔥 знімай труси — іди в полет!", delay: 2900 },
          { text: "🏁 фінал? ТИ ЗАТРОЛЕН!", delay: 3200 },
          { text: "🩲 знімай труси — іди в полет!", delay: 2700 },
          { text: "🎬 продовження слідує... (перезапусти)", delay: 3500 }
        ];

        queue = shuffleArray(baseLines);
        queue[0] = { text: "🔥 знімай труси — іди в полет!", delay: 2800 };
        queue[queue.length - 1] = { text: "💥 ТИ ЗАТРОЛЕН, ДРУЖЕ! (перезапусти)", delay: 3500 };

        index = 0;
        isPlaying = true;
        showNextSubtitle();
      }

      function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      document.getElementById('restartBtn').addEventListener('click', function() {
        startTrolling();
      });

      window.addEventListener('load', function() {
        setTimeout(() => {
          startTrolling();
        }, 300);
      });

      document.getElementById('trollScreen').addEventListener('click', function(e) {
        if (e.target.tagName !== 'BUTTON') {
          startTrolling();
        }
      });

      window.addEventListener('beforeunload', function() {
        if (timeoutId) clearTimeout(timeoutId);
      });

    })();
  </script>
</body>
</html>
